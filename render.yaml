services:
  - type: web
    name: poket-harian
    runtime: node
    plan: free
    buildCommand: node --check backend/server.mjs
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.11.0
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: DEEPSEEK_MAX_ATTEMPTS
        value: 1

      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_STORE_URL
        sync: false
      - key: SESSION_STORE_TOKEN
        sync: false
